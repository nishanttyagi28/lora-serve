[project]
name = "lora-serve"
version = "0.1.0"
description = "LoRA fine-tune a small open model for news topic classification and serve it with FastAPI"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "prometheus-client>=0.20",
  "jsonschema>=4.21",
  "pydantic>=2.6",
]

[project.optional-dependencies]
ml = ["torch>=2.2", "transformers>=4.44", "peft>=0.12", "datasets>=2.19", "accelerate>=0.30", "mlflow>=2.12", "matplotlib>=3.8"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools]
packages = ["lora_serve"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
